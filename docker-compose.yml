services:
  mysql-clientes:
    image: mysql:8.0
    container_name: mysql-clientes
    restart: always
    environment:
      MYSQL_DATABASE: bank_clientes_db
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3307:3306"
    volumes:
      - mysql_clientes_data:/var/lib/mysql

volumes:
  mysql_clientes_data: