# UBICACIÓN: api-gateway -> src/main/resources/application.properties
spring.application.name=api-gateway
server.port=8080

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

# Desactivamos el localizador automático ambiguo
spring.cloud.gateway.mvc.discovery.locator.enabled=false

# --- MAPEADO EXPLÍCITO DE RUTAS (Estándar WebMVC) ---

# Ruta para el Microservicio de Clientes
spring.cloud.gateway.mvc.routes[0].id=ms-clientes-route
spring.cloud.gateway.mvc.routes[0].uri=lb://ms-clientes
spring.cloud.gateway.mvc.routes[0].predicates[0]=Path=/api/clientes/**

# Ruta para el Microservicio de Cuentas
spring.cloud.gateway.mvc.routes[1].id=ms-cuentas-route
spring.cloud.gateway.mvc.routes[1].uri=lb://ms-cuentas
spring.cloud.gateway.mvc.routes[1].predicates[0]=Path=/api/cuentas/**